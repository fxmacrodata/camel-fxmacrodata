[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "camel-fxmacrodata"
version = "0.1.0"
description = "Native FXMacroData research integration for Camel"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["fxmacrodata-public-client==0.1.0", "camel-ai==0.2.90"]

[project.urls]
Homepage = "https://fxmacrodata.com/?utm_source=pypi&utm_medium=referral&utm_campaign=camel-fxmacrodata&utm_content=homepage"
Documentation = "https://fxmacrodata.com/documentation/reference?utm_source=pypi&utm_medium=referral&utm_campaign=camel-fxmacrodata&utm_content=docs"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3"]

[tool.hatch.build]
ignore-vcs = true
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/camel_fxmacrodata"]

[tool.hatch.build.targets.sdist]
include = ["src/camel_fxmacrodata/**", "README.md", "LICENSE", "pyproject.toml", "examples/**", "tests/**", "CAPABILITIES.md", "PUBLIC_FILES.json", ".gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 79
target-version = "py310"
